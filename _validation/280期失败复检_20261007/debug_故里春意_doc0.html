</html><span></span><script type="text/javascript" >function processAllStyleBackgroundImages() {
  const styleTags = document.querySelectorAll("style");

  styleTags.forEach((styleTag) => {
    let cssText = styleTag.innerHTML;

    //const bgRegex = /(background(?:-image)?\s*:\s*[^;]+;)/gi;
    const bgRegex = /((?:background(?:-image)?|content)\s*:\s*[^;]+;)/gi;
    const bgMatches = [...cssText.matchAll(bgRegex)];
    if (bgMatches.length === 0) return;

    bgMatches.forEach((bgMatch) => {
      const fullBgText = bgMatch[0];
      const urlRegex = /url\(\s*(['"]?)(.*?)\1\s*\)/gi;
      const urlMatches = [...fullBgText.matchAll(urlRegex)];
      if (urlMatches.length === 0) return;

      const processedUrls = new Set();
      const replacements = [];

      urlMatches.forEach((urlMatch) => {
        const origUrl = urlMatch[2];
        if (origUrl.startsWith('data:') || processedUrls.has(origUrl) || !origUrl.includes('/epy/')) {return;}
        processedUrls.add(origUrl);

        const p = new Promise((resolve) => {
          myAjax(origUrl, function(blob) {
            try {
              const base64 = geteEnDateUrl(blob);
              if (!base64) return resolve(null);
              resolve({ origUrl, base64 });
            } catch (e) {
              //console.warn(`✘ 轉換失敗: ${origUrl}`, e);
              resolve(null);
            }
          });
        });
        replacements.push(p);
      });

      Promise.all(replacements).then(results => {
        let newBgText = fullBgText;
        results.forEach(item => {
          if (!item) return;
          const { origUrl, base64 } = item;
          const escapedUrl = origUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const replaceRegex = new RegExp(`url\\(\\s*(['"]?)${escapedUrl}\\1\\s*\\)`, 'g');
          newBgText = newBgText.replace(replaceRegex, `url('${base64}')`);
          //console.log(`✔ 替換 ${origUrl} 為 base64`);
        });
        
        cssText = cssText.replace(fullBgText, newBgText);
        styleTag.innerHTML = cssText;
      });
    });
  });
}
processAllStyleBackgroundImages();</script>
